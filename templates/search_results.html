<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results | Rang-e-Fatima</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: #ffffff; color: #111111; }
        .main-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #eeeeee; background: #ffffff; position: sticky; top: 0; z-index: 100; }
        .brand-logo a { text-decoration: none; color: #111111; text-align: center; display: block; }
        .brand-logo h1 { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
        .brand-logo p { font-size: 10px; letter-spacing: 2px; color: #666; margin-top: -3px; }
        .icon-btn { background: none; border: none; font-size: 18px; color: #111111; margin: 0 10px; cursor: pointer; text-decoration: none; }
        .container { max-width: 1400px; margin: 40px auto; padding: 0 30px; }
        .page-title { font-family: 'Cinzel', serif; font-size: 28px; margin-bottom: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; }
        .product-card { background: #ffffff; cursor: pointer; }
        .product-card-link { text-decoration: none; color: inherit; display: block; }
        .card-image-box { position: relative; overflow: hidden; background: #f7f7f7; border-radius: 6px; }
        .card-image-box img { width: 100%; height: 420px; object-fit: cover; display: block; }
        .product-info { padding: 15px 5px; }
        .product-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #222222; }
        .product-price { font-size: 15px; font-weight: 700; color: #111111; }
    </style>
</head>
<body>
    <header class="main-header">
        <a href="/" class="icon-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="brand-logo">
            <a href="/">
                <h1>RANG-E-FATIMA</h1>
                <p>COLORS OF ELEGANCE</p>
            </a>
        </div>
        <div>
            <a href="/" class="icon-btn"><i class="fas fa-home"></i></a>
        </div>
    </header>

    <main class="container">
        <h2 class="page-title">Search Results for "{{ query }}"</h2>
        <div class="product-grid">
            {% for item in products %}
            <div class="product-card">
                <a href="{{ url_for('product_detail', product_id=item.id) }}" class="product-card-link">
                    <div class="card-image-box">
                        <img src="{{ url_for('static', filename=item.image) }}" alt="{{ item.title }}">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">{{ item.title }}</h3>
                        <p class="product-price">{{ item.price }}</p>
                    </div>
                </a>
            </div>
            {% else %}
            <p>No products found matching your search.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
